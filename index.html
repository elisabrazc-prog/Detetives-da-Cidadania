<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<title>Detetives da Cidadania</title>
<style>
:root{--bg1:#0f5132;--fg1:#fff;--accent:#ffd54a;--accent-fg:#1b1b1b;--bg2:#fff8e6;--fg2:#1d2b22;--card:#fff;--border:#e2d6b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a3322;--bg2:#16201a;--fg2:#f1ede0;--card:#1f2c24;--border:#34463a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0a3322;--bg2:#16201a;--fg2:#f1ede0;--card:#1f2c24;--border:#34463a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--fg1);overflow:hidden}
.stage{position:relative;width:100%;height:100%;min-height:100vh}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#s1{--bw:clamp(200px,min(58vw,56vh),440px);z-index:1;background:radial-gradient(ellipse at center,#fffaf0 0%,#fbf3dc 55%,#f1e4bd 100%);color:#0f5132;padding-top:0;padding-bottom:0;justify-content:flex-start;overflow:hidden}
.frame{position:absolute;inset:14px;border:3px solid #0f5132;border-radius:22px;box-shadow:inset 0 0 0 7px #fbf3dc,inset 0 0 0 9px #c9a227;pointer-events:none}
.deco{position:absolute;width:clamp(100px,22vw,200px);height:auto;pointer-events:none}
.tl{top:20px;left:20px}
.tr{top:20px;right:20px;transform:scaleX(-1)}
.bl{bottom:20px;left:20px;transform:scaleY(-1)}
.br{bottom:20px;right:20px;transform:scale(-1,-1)}
#s1 .books{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:var(--bw);height:auto}
#s1 .inside{position:relative;z-index:2;flex:1;width:100%;display:grid;grid-template-rows:.7fr auto 1.3fr;justify-items:center}
#s1 #go{grid-row:3;align-self:center;margin-bottom:calc(var(--bw)*.62 + 26px)}
#s1 h1{grid-row:2}
#s1 .lens{position:absolute;left:calc(100% - 1.6em);top:-.2em;width:2.6em;height:2.8em;overflow:visible;pointer-events:none}
#s1 .kicker{font-family:"Lora",Georgia,serif;font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(12px,2.4vw,15px);color:#8a6a00;margin-top:6px}
#s1 h1{position:relative;display:block;width:fit-content;margin:0 auto;font-size:clamp(40px,min(11vw,12vh),104px);line-height:1;font-family:"Playfair Display",Georgia,"Times New Roman",serif}
#s1 h1 .t1{display:block;font-weight:800;font-size:1em;color:#0f5132;text-shadow:3px 3px 0 #e6c65a,5px 5px 0 rgba(15,81,50,.18)}
#s1 h1 .t2{display:block;font-style:italic;font-weight:600;font-size:.62em;color:#8a6a00;margin-top:2px}
#s1 .orn{font-size:26px;color:#c9a227;margin:6px 0 20px}
#s1 #go{background:#0f5132;color:#fff;font-family:"Lora",Georgia,serif}
#go{font:inherit;font-weight:700;font-size:18px;padding:14px 32px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
#go:hover{transform:translateY(-2px)}#go:active{transform:translateY(3px)}
#s2{background:var(--bg2);color:var(--fg2);clip-path:circle(0 at 50% 50%);visibility:hidden;transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
#s2.open{visibility:visible;clip-path:circle(150% at 50% 50%)}
#s2 .inner{width:100%;max-width:720px;overflow-y:auto;max-height:100%;padding:8px}
.tag{display:inline-block;background:var(--bg1);color:var(--fg1);padding:6px 16px;border-radius:999px;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#s2 h2{font-size:clamp(30px,6vw,48px);margin:14px 0 10px}
.desc{font-size:clamp(16px,2.6vw,20px);line-height:1.55;margin:0 0 24px}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:clamp(16px,2.4vw,19px);text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--fg2);cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .15s,border-color .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--bg1)}
.opt .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg1);color:var(--fg1);display:grid;place-items:center;font-weight:700}
.opt.bad{border-color:#b3261e;opacity:.55}
.opt:disabled{cursor:default}
#res{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;visibility:hidden;clip-path:circle(0 at 50% 50%);transition:clip-path .8s cubic-bezier(.7,0,.2,1);overflow:hidden}
#res.open{visibility:visible;clip-path:circle(150% at 50% 50%)}
#res.good{background:linear-gradient(160deg,#b9e6a6 0%,#93d393 50%,#72c48f 100%);color:#10372a}
#res.wrong{background:linear-gradient(160deg,#ef5b4f 0%,#e03a3a 55%,#c92d33 100%);color:#3a100c}
.rcard{position:relative;z-index:2;width:100%;max-width:640px;max-height:100%;overflow-y:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);border-radius:28px;padding:32px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);transform:scale(.9);opacity:0;transition:transform .5s .5s,opacity .5s .5s}
#res.open .rcard{transform:none;opacity:1}
.rcard .big{font-size:72px;line-height:1}
.rcard h3{font-size:clamp(28px,6vw,44px);margin:12px 0 6px}
.rcard .sub{font-size:15px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin:0 0 18px}
.rcard p.why{font-size:clamp(17px,2.6vw,21px);line-height:1.6;margin:0 0 24px}
.rcard button{font:inherit;font-weight:700;font-size:17px;padding:13px 30px;border:0;border-radius:999px;background:#ffd54a;color:#1b1b1b;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.rcard button:active{transform:translateY(3px)}
.cf{position:absolute;top:-40px;font-size:26px;z-index:1;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#s2{z-index:2;background:radial-gradient(ellipse at center,#fffaf0 0%,#fbf3dc 55%,#f1e4bd 100%);color:#1d2b22;padding:48px 36px}
#s2 .inner{position:relative;z-index:2}
#s2 .deco{width:clamp(56px,11vw,110px)}
#s2 .tag{background:#0f5132;color:#fff;font-family:"Lora",Georgia,serif;font-weight:600}
#s2 h2{font-family:"Playfair Display",Georgia,serif;font-weight:800;color:#0f5132;text-shadow:2px 2px 0 #e6c65a}
#s2 .desc{font-family:"Lora",Georgia,serif;font-weight:500}
#s2 .opt{background:#fffaf0;color:#1d2b22;border-color:#e2d6b5;font-family:"Lora",Georgia,serif;font-weight:600}
#s2 .opt:hover:not(:disabled){border-color:#0f5132}
#s2 .opt.bad{border-color:#b3261e;opacity:.55}
#s2 .opt .n{background:#0f5132;color:#fff;font-family:"Playfair Display",Georgia,serif}
#res .frame{border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 0 0 6px transparent,inset 0 0 0 7.5px rgba(255,255,255,.45)}
.rcard h3{font-family:"Playfair Display",Georgia,serif;font-weight:800}
.rcard .sub,.rcard p.why,.rcard button{font-family:"Lora",Georgia,serif}
@media (prefers-reduced-motion:reduce){#s2,#res,.rcard{transition:none}.cf{display:none}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.rs{animation:rs 4s ease-in infinite}
@keyframes rs{0%{transform:translateY(20px);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.gl{transform-box:fill-box;transform-origin:center;animation:gl 3.5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.7;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
#s1 .ch{display:inline-block}
@keyframes drop{from{transform:translateY(-60px) rotate(-12deg);opacity:0}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fl{position:absolute;z-index:1;font-size:clamp(22px,4vw,34px);pointer-events:none;animation:flt 6s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
#s1 #go{animation:pulse 1.8s ease-in-out infinite}
#s1 #go:hover{animation-play-state:paused}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

#s2 .opts .opt:nth-child(1) .n{background:#e8742a}
#s2 .opts .opt:nth-child(2) .n{background:#1f8a8a}
#s2 .opt:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg) scale(1.02)}
#s2 .inner.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.9) translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tw,.gl,.ch,.fl,#s1 #go,.inner.pop{animation:none!important}.rs{display:none}}
.cf svg{display:block}
.det{display:block;margin:0 auto 4px;width:clamp(84px,13vh,124px);height:auto}
#res .deco{display:none;width:clamp(70px,16vw,150px)}
#res.final{background:radial-gradient(ellipse at center,#fffaf0 0%,#fbf3dc 55%,#f1e4bd 100%);color:#1d2b22}
#res.final .deco{display:block}
#res.final .frame{border-color:#0f5132;box-shadow:inset 0 0 0 7px #fbf3dc,inset 0 0 0 9px #c9a227}
#res.final .rcard{background:transparent;border:0;box-shadow:none;backdrop-filter:none}
#res.final .det{width:clamp(300px,68vw,620px);margin:0 auto 6px}
#res.final h3{font-size:clamp(40px,10vw,84px);line-height:1.05;text-shadow:3px 3px 0 #e6c65a,5px 5px 0 rgba(15,81,50,.18)}
#res.final .sub{color:#8a6a00;font-weight:600}
#res.final button{background:#0f5132;color:#fff}
#res.good .rcard{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.9)}
#res.good button{background:#f9b233}
#s2{--dh:clamp(110px,18vh,150px)}
#s2 h2{position:relative;display:inline-block;margin:calc(var(--dh) - 40px) 0 10px}
#s2 .det{position:absolute;right:calc(100% + 8px);bottom:-6px;height:var(--dh);width:auto;aspect-ratio:240/340;margin:0}
@media (max-width:560px){#s2{--dh:88px}#s2 h2{font-size:30px}}
#s2 h2,#s2 .opt .n{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.tro{display:block;margin:0 auto;width:clamp(90px,16vw,128px);height:auto;animation:trin .7s cubic-bezier(.3,1.6,.5,1) .5s both}
@keyframes trin{from{transform:scale(.3) rotate(-10deg);opacity:0}}
#s2 h2{margin:14px 0 10px}
@media (prefers-reduced-motion:reduce){.tro{animation:none}}
#res.wrong .rcard{background:rgba(255,255,255,.42);border-color:rgba(255,255,255,.9)}
#res.wrong button{background:#f9b233}
.emo{display:block;margin:0 auto;width:clamp(130px,28vw,200px);height:auto;animation:trin .6s cubic-bezier(.3,1.6,.5,1) .4s both}
@media (prefers-reduced-motion:reduce){.emo{animation:none}}
#res.final h3{margin-bottom:0}
#res.final .sub{margin:22px 0}
#res.final .big{font-size:clamp(80px,16vw,110px);line-height:1.1}
.ico{display:inline-block;margin:0}
.ico.bk{font-size:.58em;margin-right:-.04em;transform:translateY(.28em) rotate(-16deg)}
.pil{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:clamp(8px,2.2vw,26px)}
.pl{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:"Lora",Georgia,serif}
.pl b{font-size:clamp(9px,1.4vw,12px);color:#0f5132;letter-spacing:.04em;text-align:center}
.pc{display:grid;place-items:center;width:clamp(34px,5vw,48px);height:clamp(34px,5vw,48px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf0,#fbe9b0);border:3px solid #c9a227;box-shadow:0 3px 0 rgba(15,81,50,.2);font-size:clamp(17px,2.6vw,24px)}
.trail{position:absolute;bottom:20px;left:calc(50% - var(--bw)*1.65);width:calc(var(--bw)*1.25);height:auto;pointer-events:none}
@media(max-width:700px){.trail{display:none}}
.lv{position:absolute;top:-30px;width:18px;height:12px;z-index:1;pointer-events:none;opacity:.5;animation:lvf linear infinite}
@keyframes lvf{to{transform:translateY(105vh) translateX(30px) rotate(300deg)}}
.ff{position:absolute;bottom:calc(var(--bw)*.2);width:7px;height:7px;border-radius:50%;background:#ffd54a;box-shadow:0 0 8px 3px rgba(255,213,74,.7);animation:ffu 6s ease-in infinite;opacity:0;pointer-events:none}
@keyframes ffu{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(calc(var(--bw)*-.55)) translateX(14px);opacity:0}}
#s2 .inner{background:linear-gradient(#fffdf6,#fbf1d6);border:2px solid #e2cf9d;border-radius:14px;box-shadow:0 8px 24px rgba(90,60,20,.15);padding:34px 28px 26px}
.clip{position:absolute;top:2px;left:30px;width:26px;height:48px}
.stamp{position:absolute;top:16px;right:16px;transform:rotate(8deg);border:3px double #b3261e;color:#b3261e;font:700 clamp(10px,1.6vw,13px) "Lora",Georgia,serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:6px;opacity:.85}
#s2 .opt{position:relative;border-radius:4px 12px 12px 12px;background:#fffdf4;border:2px solid #d9c590}
#bgS{position:absolute;left:16px;width:calc(100% - 32px);bottom:16px;height:26%;border-radius:0 0 18px 18px;pointer-events:none;z-index:0}
#bgS g{display:none}
#bgS[data-t="forest"] #th-forest,#bgS[data-t="house"] #th-house,#bgS[data-t="castle"] #th-castle,#bgS[data-t="bean"] #th-bean{display:block}
.stampR{display:none;position:absolute;top:14px;right:14px;border:4px double;padding:6px 14px;font:700 clamp(13px,2.4vw,19px) "Lora",Georgia,serif;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.4);border-radius:8px;animation:stampIn .5s cubic-bezier(.3,1.4,.5,1) 1s both}
#res.good .stampR{display:block;color:#0f5132}
#res.wrong .stampR{display:block;color:#8f1d18}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:.92}}
.meds{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:4px 0 6px}
#res.good .pl b,#res.wrong .pl b{color:#10372a}
.tip{display:none;font:italic 500 15px "Lora",Georgia,serif;margin:-8px 0 20px}
.stars{font-size:clamp(34px,7vw,52px);letter-spacing:6px;color:#d6d0bd;line-height:1;margin:2px 0 4px}
.stars .on{color:#f5b800;text-shadow:0 2px 0 #c98a00}
.bunt{display:none;position:absolute;top:14px;left:14px;width:calc(100% - 28px);height:64px;z-index:1;pointer-events:none}
.fpw{display:none;position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(420px,70%);pointer-events:none;opacity:.5}
#res.wrong .fpw{display:block}
#rDip{display:none;margin:8px 0 0 10px}
#res.final #rDip{background:#fff;color:#0f5132;border:2px solid #0f5132;box-shadow:none}
#dip{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at center,#fffaf0,#f1e4bd);overflow:auto}
#dip.open{display:flex}
.dcard{position:relative;width:100%;max-width:640px;background:linear-gradient(#fffdf6,#fbf1d6);border:8px double #c9a227;border-radius:10px;padding:56px 28px 26px;text-align:center;font-family:"Lora",Georgia,serif;color:#1d2b22;box-shadow:0 14px 40px rgba(90,60,20,.25)}
.dseal{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#d9992a);border:3px solid #a8650d;display:grid;place-items:center;font-size:28px}
.dcard h2{font:800 clamp(28px,6vw,44px) "Playfair Display",Georgia,serif;margin:4px 0 12px;color:#0f5132}
.dk{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:#8a6a00;margin:0}
#dname{font:inherit;font-size:20px;text-align:center;border:0;border-bottom:2px solid #c9a227;background:transparent;width:80%;padding:6px;margin:8px 0;color:#1d2b22}
.dnm{font:italic 600 28px "Playfair Display",Georgia,serif;color:#d6456b;margin:4px 0 10px;min-height:1em}
.dbt button{font:inherit;font-weight:700;padding:11px 24px;border:0;border-radius:999px;background:#0f5132;color:#fff;margin:6px;cursor:pointer}
@media print{body *{visibility:hidden}#dip,#dip *{visibility:visible}#dip{position:fixed;inset:0;display:flex}#dname,.dbt{display:none}}
@media (prefers-reduced-motion:reduce){.lv,.ff,.stampR{animation:none}.ff{display:none}}
.rcard{overflow-x:hidden}
</style>
</head>

{n:4,d:'“Aceitei uma maçã e conselhos de uma desconhecida sem desconfiar, ignorando todos os avisos de segurança e colocando minha própria vida em risco. Quem sou eu e qual pilar me faltou?”',c:0,o:[

{n:5,d:'“Invadi a propriedade de um gigante sem autorização e peguei pertences que não eram meus, em vez de conversar e negociar. Quem sou eu e quais pilares deixei de seguir?”',c:1,o:[

{n:10,d:'“Fui avisada para tomar cuidado com objetos desconhecidos, mas ignorei os alertas e aceitei tocar em uma roca de fiar, colocando minha própria segurança em risco. Quem sou eu e qual pilar cidadão deixei de praticar?”',c:0,o:[

];
var idx=0,score=0,missed=false,actx=null,order=[0,1];
var s2=document.getElementById('s2'),res=document.getElementById('res'),btn=document.getElementById('rBtn'),
    opts=[].slice.call(document.querySelectorAll('.opt')),$=function(i){return document.getElementById(i)};
function gcol(t){var st=[[15,81,50],[31,138,138],[59,111,182],[138,79,176],[214,69,107],[232,116,45]],x=t*(st.length-1),i=Math.min(Math.floor(x),st.length-2),f=x-i,a=st[i],b=st[i+1];return 'rgb('+[0,1,2].map(function(k){return Math.round(a[k]+(b[k]-a[k])*f)}).join(',')+')'}
var t1=document.querySelector('#s1 .t1'),pal=['#0f5132','#e8742a','#1f8a8a','#d6456b','#c9a227'];
t1.innerHTML=t1.textContent.split('').map(function(c,i,a){return '<span class="ch" style="color:'+gcol(i/(a.length-1))+'">'+c+'</span>'}).join('');
function load(){
  var q=Q[idx]; missed=false; order=(q.c===[0,1,1,0,0,1,0,1,1,0][idx%10])?[0,1]:[1,0];var inn=document.querySelector('#s2 .inner');inn.classList.remove('pop');void inn.offsetWidth;inn.classList.add('pop');
  $('qT').textContent='Enigma '+q.n;
  $('qDesc').textContent=q.d;$('qStamp').textContent='CASO Nº '+q.n;$('bgS').setAttribute('data-t',['forest','house','house','forest','forest','house','forest','house','house','forest'][idx%10]);
  opts.forEach(function(b,i){b.lastChild.textContent=q.o[order[i]][0];b.disabled=false;b.classList.remove('bad')});
}
function tone(f,t,d,type,v,to){
  var o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);
  g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(v,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+d);
  o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+d+0.05);
}
function sound(ok){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    if(ok){[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*0.11,0.35,'triangle',0.25)});tone(1318.5,0.5,0.6,'sine',0.2)}
    else{tone(392,0,0.3,'square',0.1);tone(370,0.32,0.3,'square',0.1);tone(349,0.64,0.3,'square',0.1);tone(330,0.96,0.9,'square',0.1,230)}
  }catch(e){}
}
function confetti(){
  var C=['#f26b3a','#f9b233','#6dbb9b','#f9a8d8','#7b9bd1'],
  S=['<circle cx="8" cy="8" r="6" fill="K"/>','<path d="M8 1l2.2 4.6 5 .7-3.6 3.5.9 5L8 12.4 3.5 14.8l.9-5L.8 6.3l5-.7z" fill="K"/>','<rect x="2" y="4" width="12" height="8" rx="1.5" fill="K"/>','<path d="M1 12C3 1 7 15 9 4S13 11 15 3" fill="none" stroke="K" stroke-width="2.4" stroke-linecap="round"/>','<path d="M3 13C2 3 13 2 13 8S6 12 8 7" fill="none" stroke="K" stroke-width="2.4" stroke-linecap="round"/>'];
  for(var i=0;i<60;i++){
    var k=C[Math.floor(Math.random()*5)],w=14+Math.random()*14,s=document.createElement('span');
    s.className='cf';
    s.innerHTML='<svg viewBox="0 0 16 16" width="'+w+'" height="'+w+'">'+S[i%5].replace(/K/g,k)+'</svg>';
    s.style.left=(Math.random()*100)+'%';
    s.style.animationDuration=(2.4+Math.random()*2.4)+'s';
    s.style.animationDelay=(0.4+Math.random()*1.4)+'s';
    res.appendChild(s);setTimeout(function(el){el.remove()}.bind(null,s),7000);
  }
}
var PM={'respeito':['🤝','Respeito'],'responsabilidade':['⚖️','Responsabilidade'],'cooperação':['🧩','Cooperação'],'cuidado coletivo':['🌱','Cuidado coletivo']};
function pm(k){return '<div class="pl"><span class="pc">'+PM[k][0]+'</span><b>'+PM[k][1]+'</b></div>'}
function medals(label){var part=(label.split('–')[1]||'').toLowerCase(),h='';Object.keys(PM).forEach(function(k){if(part.indexOf(k)>-1)h+=pm(k)});$('rMed').innerHTML=h}
function finalExtras(){$('rPil').innerHTML=Object.keys(PM).map(pm).join('')}
function show(cls,icon,title,sub,why,label,fn,from){
  if(cls==='wrong')[].slice.call(res.querySelectorAll('.cf')).forEach(function(e){e.remove()});
  if(from){var r=from.getBoundingClientRect();res.style.clipPath='circle(0 at '+(r.left+r.width/2)+'px '+(r.top+r.height/2)+'px)'}
  res.className=cls;void res.offsetWidth;
  $('rIcon').innerHTML=icon;$('rTitle').textContent=title;$('rSub').textContent=sub;$('rWhy').textContent=why;$('rMed').innerHTML='';$('rPil').innerHTML='';$('stampR').textContent=cls==='good'?'Caso resolvido':'Pista falsa';
  btn.textContent=label;btn.onclick=fn;
  res.classList.add('open');res.style.clipPath='';
}
function close(){res.classList.remove('open');[].slice.call(res.querySelectorAll('.cf')).forEach(function(e){e.remove()})}
function final(){
  sound(true);
  show('final','<span class="ico bk">📖</span><span class="ico">🕵️</span>','Fim de jogo!','Vocês acertaram '+score+' de '+Q.length,
    'Parabéns, detetives! Respeito, responsabilidade, cooperação e cuidado coletivo fazem de cada um de nós um cidadão melhor.',
    'Jogar novamente',function(){idx=0;score=0;close();document.getElementById('s1').style.visibility='visible';t1.innerHTML=t1.innerHTML;s2.classList.remove('open');setTimeout(function(){s2.style.visibility='hidden'},1000)});
  $('rTitle').innerHTML='Fim de jogo!'.split('').map(function(c,i,a){return '<span style="color:'+gcol(i/(a.length-1))+'">'+c+'</span>'}).join('');
  confetti();
}
opts.forEach(function(b,i){
  b.addEventListener('click',function(){
    var q=Q[idx],j=order[i],ok=(j===q.c);sound(ok);
    if(ok){
      if(!missed)score++;
      var last=idx===Q.length-1;
      show('good','<svg class="tro" viewBox="0 0 240 260" aria-hidden="true"><use href="#trophy"/></svg>','Vocês acertaram!',q.o[j][0],q.o[j][1],last?'Ver resultado ▶':'Próximo enigma ▶',
        function(){if(last){final()}else{idx++;load();close()}},b);
      confetti();
    }else{
      missed=true;b.classList.add('bad');b.disabled=true;
      show('wrong','<svg class="emo" viewBox="0 0 260 205" aria-hidden="true"><use href="#think"/></svg>','Ops, não foi dessa vez!',q.o[j][0],q.o[j][1],'Tentar de novo',close,b);
    }
  });
});
document.getElementById('skip').addEventListener('click',function(){if(!score)score=7;close();final()});
$('go').addEventListener('click',function(e){
  var r=e.currentTarget.getBoundingClientRect(),p='circle(0 at '+(r.left+r.width/2)+'px '+(r.top+r.height/2)+'px)';
  load();s2.style.clipPath=p;s2.style.visibility='visible';void s2.offsetWidth;
  s2.classList.add('open');s2.style.clipPath='';
  setTimeout(function(){document.getElementById('s1').style.visibility='hidden'},1000);
});
})();
</script>
